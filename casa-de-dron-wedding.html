<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcial & Nadine — 31.07.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #FDFAF6;
      --ivory:        #F8F4EE;
      --warm:         #EEE8DF;
      --blush:        #E8B4A8;
      --blush-light:  #F2D5CE;
      --blush-pale:   #FAF0ED;
      --sage:         #8EAF9E;
      --sage-light:   #C3D9CF;
      --sage-pale:    #EBF3EF;
      --gold:         #C49A6C;
      --gold-pale:    #F5EAD8;
      --ink:          #2A2520;
      --mid:          #7A7268;
      --light:        #B8B0A6;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Jost', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HERO */
    .hero {
      min-height:70svh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:100px 40px 60px;
      position:relative; overflow:hidden;
    }
    .hero-bg { position:absolute; inset:0; z-index:0; }
    .blob { position:absolute; border-radius:50%; filter:blur(80px); opacity:.32; }
    .blob-1 { width:500px; height:500px; background:#F2D0C6; top:-100px; left:-150px; }
    .blob-2 { width:400px; height:400px; background:#C8DECC; top:50px; right:-100px; }
    .blob-3 { width:350px; height:350px; background:#F5E4C8; bottom:-80px; left:30%; }
    .hero > * { position:relative; z-index:1; }

    .hero-eyebrow { font-size:10px; letter-spacing:6px; text-transform:uppercase; color:var(--blush); font-weight:400; margin-bottom:32px; }
    .hero-names { font-family:var(--serif); font-size:clamp(52px,12vw,96px); font-weight:400; line-height:.9; color:var(--ink); letter-spacing:-2px; }
    .hero-and { display:block; font-style:italic; font-size:.4em; font-weight:300; color:var(--blush); letter-spacing:8px; line-height:2; }

    .hero-info { margin-top:32px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .hero-date { font-size:11px; letter-spacing:6px; text-transform:uppercase; color:var(--mid); font-weight:300; }
    .hero-loc { font-family:var(--serif); font-style:italic; font-size:20px; color:var(--light); font-weight:300; }
    .hero-thanks { margin-top:28px; max-width:440px; font-size:14px; line-height:1.9; color:var(--mid); font-weight:300; }

    /* SECTIONS */
    .section { padding:56px 32px; max-width:1000px; margin:0 auto; }
    .s-header { margin-bottom:28px; }
    .s-title { font-family:var(--serif); font-size:clamp(26px,4vw,36px); font-weight:400; color:var(--ink); }
    .s-title .emoji { font-family:var(--sans); }

    .tabs {
      display:flex; gap:4px; flex-wrap:wrap;
      margin-bottom:32px; padding:6px;
      background:var(--ivory); border-radius:40px;
      box-shadow:inset 0 1px 3px rgba(0,0,0,.04);
    }
    .tab-btn {
      flex:1 1 auto; padding:10px 20px; border-radius:30px; border:none;
      background:transparent; color:var(--mid); font-family:var(--sans);
      font-size:12px; letter-spacing:1px; cursor:pointer; transition:all .2s;
      white-space:nowrap;
    }
    .tab-btn:hover:not(.active) { color:var(--ink); }
    .tab-btn.active { background:#fff; color:var(--ink); box-shadow:0 2px 10px rgba(180,140,100,.15); font-weight:500; }

    .gallery-rows { display:flex; flex-direction:column; gap:8px; }
    .gallery-row { display:flex; gap:8px; }
    .gallery-row figure {
      position:relative; overflow:hidden; border-radius:8px; cursor:pointer;
      flex-shrink:0; box-shadow:0 2px 10px rgba(180,140,100,.08); background:var(--ivory);
    }
    .gallery-row img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .4s ease; }
    .gallery-row figure:hover img { transform:scale(1.04); }

    .load-more-wrap { text-align:center; margin-top:28px; }
    .load-more-btn {
      padding:12px 30px; border:1.5px solid var(--gold); background:transparent; color:var(--gold);
      font-family:var(--sans); font-size:11px; letter-spacing:2px; text-transform:uppercase;
      cursor:pointer; border-radius:40px; transition:all .25s ease;
    }
    .load-more-btn:hover { background:var(--gold); color:#fff; }
    .load-more-btn:disabled { opacity:.4; cursor:default; }

    .empty-note {
      font-size:13px; color:var(--light); font-weight:300; font-style:italic;
      padding:18px 0;
    }

    .playlist-embed {
      border-radius:12px;
      box-shadow:0 4px 32px rgba(180,140,100,.1);
      overflow:hidden;
    }
    .playlist-embed iframe { display:block; }

    /* LIGHTBOX */
    #lightbox {
      position:fixed; inset:0; background:rgba(24,18,14,.94);
      display:none; align-items:center; justify-content:center;
      z-index:500; padding:24px;
    }
    #lightbox.open { display:flex; }
    #lightbox img {
      max-width:90vw; max-height:82vh; border-radius:6px;
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    }
    .lb-close, .lb-prev, .lb-next {
      position:absolute; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
      color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:18px;
      transition:background .2s;
    }
    .lb-close:hover, .lb-prev:hover, .lb-next:hover { background:rgba(255,255,255,.2); }
    .lb-close { top:20px; right:20px; }
    .lb-prev { left:20px; top:50%; transform:translateY(-50%); }
    .lb-next { right:20px; top:50%; transform:translateY(-50%); }
    .lb-count {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,.7); font-size:12px; letter-spacing:1px;
    }
    @media(max-width:600px){
      .lb-prev{left:8px;} .lb-next{right:8px;} .lb-close{top:12px;right:12px;}
    }

    /* FOOTER */
    footer { padding:80px 32px 60px; text-align:center; position:relative; overflow:hidden; }
    footer::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse 70% 60% at 10% 90%,rgba(242,208,198,.32) 0%,transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 10%,rgba(200,222,204,.28) 0%,transparent 55%);
    }
    footer>*{position:relative;z-index:1;}
    .footer-names { font-family:var(--serif); font-style:italic; font-size:clamp(30px,7vw,44px); font-weight:300; color:var(--ink); }
    .footer-date  { margin-top:10px; font-size:9px; letter-spacing:6px; text-transform:uppercase; color:var(--light); font-weight:300; }

    .footer-fine { margin-top:50px; font-size:10px; letter-spacing:2px; color:var(--light); font-weight:300; }

    .reveal { opacity:0; transform:translateY(22px); transition:opacity .8s ease,transform .8s ease; }
    .reveal.in { opacity:1; transform:none; }

    @media(max-width:520px){
      .section{padding:44px 18px;}
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <p class="hero-eyebrow">Thank you for celebrating with us</p>
    <h1 class="hero-names">
      Marcial
      <span class="hero-and">&amp;</span>
      Nadine
    </h1>
    <div class="hero-info">
      <p class="hero-date">Friday · 31 July 2026</p>
      <p class="hero-loc">Rotterdam, The Netherlands</p>
    </div>
    <p class="hero-thanks">Here are the moments from our day, thank you for being part of it!</p>
  </section>

  <!-- PLAYLIST -->
  <div class="section playlist-section reveal">
    <div class="s-header">
      <h2 class="s-title">Our Wedding Playlist</h2>
    </div>
    <div class="playlist-embed">
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/1KH0eZ9N6Q0LWTBZyxrAQ4?utm_source=generator"
        width="100%"
        height="452"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <!-- GALLERIES: tab bar + one active panel, filled in by script below -->
  <div class="section reveal">
    <div class="tabs" id="tabs"></div>
    <div id="tab-content"></div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <button class="lb-prev" onclick="navLightbox(-1)">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-next" onclick="navLightbox(1)">›</button>
    <div class="lb-count" id="lb-count"></div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-names">Marcial &amp; Nadine</div>
    <div class="footer-date">31 · 07 · 2026 · Rotterdam</div>

    <p class="footer-fine">Marcial &amp; Nadine · Rotterdam · 2026</p>
  </footer>

<script>
  /* ============ CONFIG: one entry per moment of the day ============
     key    -> folder name inside /photos/
     title  -> tab label / section heading
     maxTry -> safety ceiling; discovery stops as soon as it hits the
               first missing number, so this just needs to be higher
               than the most photos you'll ever add to that folder.
  =================================================================== */
  const MOMENTS = [
    { key: 'civil',     title: 'Civil Marriage',   maxTry: 400 },
    { key: 'ceremony',  title: 'Wedding Ceremony', maxTry: 400 },
    { key: 'reception', title: 'Reception',        maxTry: 400 },
    { key: 'party',     title: 'Party 🎶',         maxTry: 400 },
  ];

  const BATCH_SIZE = 30;
  const ROW_GAP = 8;

  // Per-moment state, built lazily the first time its tab is opened.
  const state = {}; // key -> { urls: [], items: [], loadedCount: 0, built: false }
  MOMENTS.forEach(m => state[m.key] = { urls: [], items: [], loadedCount: 0, built: false });

  let activeKey = MOMENTS[0].key;
  let lb = { key: null, photoIndex: 0 };

  function tryLoad(src) {
    // HEAD requests fetch only response headers, not the image itself —
    // so discovering which photos exist doesn't download any of them.
    return fetch(src, { method: 'HEAD' }).then(res => res.ok).catch(() => false);
  }

  async function discoverUrls(moment) {
    const urls = [];
    for (let i = 1; i <= moment.maxTry; i++) {
      const ok = await tryLoad(`photos/${moment.key}/${i}.jpg`);
      if (!ok) break;
      urls.push(i);
    }
    return urls;
  }

  function targetRowHeight() {
    return window.innerWidth < 560 ? 130 : 220;
  }

  // Measures one photo's aspect ratio via its (small) thumbnail, falling
  // back to the full-size image if no thumbnail exists yet.
  function measureItem(moment, num) {
    const thumbSrc = `photos/${moment.key}/thumbs/${num}.jpg`;
    const fullSrc = `photos/${moment.key}/${num}.jpg`;
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ thumbSrc, fullSrc, aspect: img.naturalWidth / img.naturalHeight || 1 });
      img.onerror = () => {
        const img2 = new Image();
        img2.onload = () => resolve({ thumbSrc: fullSrc, fullSrc, aspect: img2.naturalWidth / img2.naturalHeight || 1 });
        img2.onerror = () => resolve({ thumbSrc: fullSrc, fullSrc, aspect: 1 });
        img2.src = fullSrc;
      };
      img.src = thumbSrc;
    });
  }

  // Classic "justified gallery" packing: walk items left to right, and as
  // soon as a row's items (scaled to a common height) would fill the
  // container width, lock that row in at the exact height needed to make
  // it fill edge to edge. The final, still-incomplete row is left at the
  // target height, unstretched — never a ragged gap, just a normal-looking
  // partial row exactly like Flickr/Google Photos do.
  function layoutRows(items, containerWidth) {
    const rows = [];
    let buffer = [];
    const targetH = targetRowHeight();

    items.forEach(item => {
      buffer.push(item);
      const widthAtTarget = buffer.reduce((sum, it) => sum + it.aspect * targetH, 0)
        + ROW_GAP * (buffer.length - 1);
      if (widthAtTarget >= containerWidth) {
        const totalAspect = buffer.reduce((s, it) => s + it.aspect, 0);
        const rowHeight = (containerWidth - ROW_GAP * (buffer.length - 1)) / totalAspect;
        rows.push({ height: rowHeight, items: buffer.map(it => ({ ...it, width: rowHeight * it.aspect })) });
        buffer = [];
      }
    });
    if (buffer.length) {
      rows.push({ height: targetH, items: buffer.map(it => ({ ...it, width: targetH * it.aspect })) });
    }
    return rows;
  }

  function renderActiveTab() {
    const s = state[activeKey];
    const content = document.getElementById('tab-content');

    if (s.built && s.items.length === 0) {
      content.innerHTML = `<p class="empty-note">Photos coming soon</p>`;
      return;
    }

    const containerWidth = content.clientWidth || content.parentElement.clientWidth;
    const rows = layoutRows(s.items, containerWidth);

    const rowsHTML = rows.map(row => `
      <div class="gallery-row" style="height:${row.height}px">
        ${row.items.map(it => {
          const idx = s.items.findIndex(x => x.fullSrc === it.fullSrc);
          return `
          <figure style="width:${it.width}px" onclick="openLightbox('${activeKey}', ${idx})">
            <img src="${it.thumbSrc}" loading="lazy" alt="${activeKey} photo">
          </figure>`;
        }).join('')}
      </div>`).join('');

    const hasMore = s.loadedCount < s.urls.length;
    content.innerHTML = `
      <div class="gallery-rows">${rowsHTML}</div>
      ${hasMore ? `<div class="load-more-wrap"><button class="load-more-btn" id="loadMoreBtn">Load more</button></div>` : ''}
    `;
    if (hasMore) {
      document.getElementById('loadMoreBtn').addEventListener('click', () => loadNextBatch(activeKey));
    }
  }

  async function loadNextBatch(key) {
    const s = state[key];
    const moment = MOMENTS.find(m => m.key === key);
    const btn = document.getElementById('loadMoreBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }

    const nextNums = s.urls.slice(s.loadedCount, s.loadedCount + BATCH_SIZE);
    const measured = await Promise.all(nextNums.map(num => measureItem(moment, num)));
    s.items.push(...measured);
    s.loadedCount += nextNums.length;

    if (key === activeKey) renderActiveTab();
  }

  async function openTab(key) {
    activeKey = key;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));

    const s = state[key];
    if (!s.built) {
      const content = document.getElementById('tab-content');
      content.innerHTML = `<p class="empty-note">Loading photos…</p>`;
      const moment = MOMENTS.find(m => m.key === key);
      s.urls = await discoverUrls(moment);
      s.built = true;
      if (s.urls.length) await loadNextBatch(key);
      else renderActiveTab();
    } else {
      renderActiveTab();
    }
  }

  function buildTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = MOMENTS.map((m, i) =>
      `<button class="tab-btn${i === 0 ? ' active' : ''}" data-key="${m.key}" onclick="openTab('${m.key}')">${m.title}</button>`
    ).join('');
  }

  function openLightbox(key, photoIndex) {
    lb = { key, photoIndex };
    showLightboxImage();
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  function navLightbox(dir) {
    const items = state[lb.key].items;
    lb.photoIndex = (lb.photoIndex + dir + items.length) % items.length;
    showLightboxImage();
  }
  function showLightboxImage() {
    const items = state[lb.key].items;
    document.getElementById('lb-img').src = items[lb.photoIndex].fullSrc;
    document.getElementById('lb-count').textContent = `${lb.photoIndex + 1} / ${items.length}`;
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navLightbox(-1);
    if (e.key === 'ArrowRight') navLightbox(1);
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state[activeKey].built) renderActiveTab(); }, 200);
  });

  function initReveal() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  }

  buildTabs();
  openTab(activeKey);
  initReveal();
</script>
</body>
</html>
